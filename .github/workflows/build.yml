name: Build check

on:
  workflow_dispatch:
  push:
    branches: [main, glass-toolchain]
    paths:
      - "android-app/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-check
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Decode release keystore
        run: echo "${{ secrets.HIRAKU_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > ${{ github.workspace }}/release.jks
      - name: Build playground release APK
        run: |
          set -o pipefail
          ./gradlew :lynket-playground:assembleRelease --stacktrace 2>&1 | tee ${{ github.workspace }}/build.log
        env:
          HIRAKU_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          HIRAKU_KEYSTORE_PASSWORD: ${{ secrets.HIRAKU_KEYSTORE_PASSWORD }}
          HIRAKU_KEY_ALIAS: hiraku
          HIRAKU_KEY_PASSWORD: ${{ secrets.HIRAKU_KEYSTORE_PASSWORD }}
      - name: Dump build errors as annotations
        if: failure()
        run: |
          LOG=${{ github.workspace }}/build.log
          esc() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | cut -c1-600; }
          START=$(grep -n "FAILURE: Build failed" "$LOG" | head -1 | cut -d: -f1)
          START=${START:-200}
          FROM=$((START > 200 ? START - 200 : 1))
          { sed -n "${FROM},${START}p" "$LOG" || true; } \
            | grep -iE "error|exception|caused|illegal|nosuch|noclass|unsupported|kapt|dagger|anvil" \
            | grep -vE "^> Task |^[[:space:]]+at " \
            | awk 'NF' | awk '!seen[$0]++' | head -22 | while IFS= read -r line; do
            echo "::error::$(esc "$line")"
          done
          { sed -n "${START},\$p" "$LOG" || true; } \
            | grep -vE "^[[:space:]]+at " \
            | grep -vE "^\* (Try|Get more help)" \
            | awk 'NF' | awk '!seen[$0]++' | head -22 | while IFS= read -r line; do
            echo "::error::$(esc "$line")"
          done
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lynket-playground-release
          path: android-app/lynket-playground/build/outputs/apk/release/*.apk
