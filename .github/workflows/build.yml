name: Build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-check
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Decode release keystore
        run: echo "${{ secrets.HIRAKU_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > ${{ github.workspace }}/release.jks
      - name: Build playground release APK
        run: ./gradlew :lynket-playground:assembleRelease --stacktrace
        env:
          HIRAKU_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          HIRAKU_KEYSTORE_PASSWORD: ${{ secrets.HIRAKU_KEYSTORE_PASSWORD }}
          HIRAKU_KEY_ALIAS: hiraku
          HIRAKU_KEY_PASSWORD: ${{ secrets.HIRAKU_KEYSTORE_PASSWORD }}
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lynket-playground-release
          path: android-app/lynket-playground/build/outputs/apk/release/*.apk
      - name: Dump compile errors as annotations (temporary CI debug)
        if: failure()
        run: |
          ./gradlew :lynket-playground:compileReleaseKotlin --console=plain > /tmp/buildlog.txt 2>&1 || true
          grep -E "^e: |FAILED|error:" /tmp/buildlog.txt | head -30 | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error::$esc"
          done
          true
